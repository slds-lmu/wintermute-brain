# Reusable index Action for a brain content repo (01 § 7, 03 § 2.1),
# called on every push to the content repo's main at a pinned release tag:
#   jobs:
#     index:
#       if: github.event.head_commit.author.email != 'brain-agent-index@agents.invalid'
#       uses: slds-lmu/wintermute-brain/.github/workflows/brain-index.yml@v0.1.0
#       with: { code-ref: v0.1.0 }
#       secrets: inherit
# Regenerates the index files and applies the safe link fix. Indexes are
# never part of PRs, so this is their single writer. Commits as
# brain-agent-index and pushes as the brain GitHub App, the ruleset's
# bypass actor (App tokens expire after an hour, so one is minted per run).
name: brain-index

on:
  workflow_call:
    inputs:
      code-ref:
        required: true
        type: string
    secrets:
      BRAIN_APP_ID:
        required: true
      BRAIN_APP_PRIVATE_KEY:
        required: true

jobs:
  index:
    runs-on: ubuntu-latest
    concurrency:
      group: index-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.BRAIN_APP_ID }}
          private-key: ${{ secrets.BRAIN_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},wintermute-brain

      - uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: slds-lmu/wintermute-brain
          ref: ${{ inputs.code-ref }}
          path: code
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Regenerate indexes and normalise links
        working-directory: content
        run: |
          python3 ../code/plugin/tools/index
          python3 ../code/plugin/tools/lint --fix --no-stale --no-orphans --no-gitleaks || true

      - name: Commit and push if anything changed
        working-directory: content
        run: |
          git add -A index.md wiki
          git diff --cached --quiet && { echo "indexes current"; exit 0; }
          git -c user.name=brain-agent-index -c user.email=brain-agent-index@agents.invalid \
            commit --quiet -m "index: regenerate" -m "Agent: brain-agent-index" -m "Invoked-by: github-actions"
          # Someone may have merged meanwhile; rebase and retry a few times.
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the index commit"; exit 1
