# Regenerate the index files on main after every merge (01 § 7, 03 § 2.1)
# and apply the safe link fix. Indexes are never part of PRs, so this
# Action is their single writer and parallel PRs never conflict on them.
# Commits as brain-agent-index (agents.txt) and pushes as the brain
# GitHub App, the ruleset's only bypass actor (03 § 2.1).
name: index

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: index-main
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    # Skip the Action's own commits to avoid a loop.
    if: github.event.head_commit.author.email != 'brain-agent-index@agents.invalid'
    steps:
      # The default Actions token cannot bypass the ruleset's required
      # check on main. The brain GitHub App (06 § 4) is the ruleset's only
      # bypass actor, so push with a short-lived token minted from the
      # App's id and private key (repo secrets BRAIN_APP_ID and
      # BRAIN_APP_PRIVATE_KEY). App tokens expire after one hour, so a
      # stored token would not work.
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.BRAIN_APP_ID }}
          private-key: ${{ secrets.BRAIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Regenerate indexes and normalise links
        run: |
          python3 tools/index
          python3 tools/lint --fix --no-stale --no-orphans --no-gitleaks || true

      - name: Commit and push if anything changed
        run: |
          git add -A index.md wiki
          git diff --cached --quiet && { echo "indexes current"; exit 0; }
          git -c user.name=brain-agent-index -c user.email=brain-agent-index@agents.invalid \
            commit --quiet -m "index: regenerate" -m "Agent: brain-agent-index" -m "Invoked-by: github-actions"
          # Someone may have merged meanwhile; rebase and retry a few times.
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the index commit"; exit 1
