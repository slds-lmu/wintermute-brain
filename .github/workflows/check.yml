# Code repo CI: the tool tests (fixture wiki, one broken copy per lint
# rule, git flow, merge wait, digest pieces). The job is named `check`
# because the ruleset on main requires a check of that name.
# The brain content's own checks are the reusable workflows
# brain-check.yml and brain-index.yml, called by the content repos at a
# pinned release tag (01 § 1).
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - run: python3 -m unittest discover -s tests -v
