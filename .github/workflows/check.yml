# Required check for the brain repo (03 § 2.1). Runs on every PR and on
# every push to main:
#   - mechanical lint (tools/lint) with the lock and human-line rules for
#     agent commits (author listed in agents.txt);
#   - commit-op preconditions: files changed in the PR are unchanged on
#     main since the PR's base, created files don't exist on main.
# Make this workflow a required status check in branch protection for
# main. Findings on pushes to main go to the "Brain health" issue.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # lint needs history for blame, stale and raw-immutable checks
          lfs: false             # text files are enough for lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML and gitleaks
        run: |
          pip install --quiet pyyaml
          # Pinned gitleaks release; bump deliberately.
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Determine base, head and author kind
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin main
            BASE=$(git merge-base origin/main HEAD)
            HEAD_SHA=$(git rev-parse HEAD)
            # HEAD is GitHub's test merge commit: its author is whoever opened
            # the PR and its message has no trailers. The author kind and the
            # Overrides-human trailer come from the PR's own head commit.
            META_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            # First push or forced history: fall back to the parent commit.
            git cat-file -e "$BASE" 2>/dev/null || BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD_SHA")
            META_SHA="$HEAD_SHA"
          fi
          AUTHOR=$(git log -1 --format=%ae "$META_SHA" | tr 'A-Z' 'a-z')
          AGENT=""
          while read -r name email; do
            [ "$email" = "<$AUTHOR>" ] && AGENT="$name"
          done < <(grep -v '^#' agents.txt | sed 's/ *#.*//' | awk 'NF==2')
          OVERRIDES=$(git log -1 --format=%b "$META_SHA" | sed -n 's/^Overrides-human: *//p' | tr '\n' ' ')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "overrides=$OVERRIDES" >> "$GITHUB_OUTPUT"
          echo "base=$BASE head=$HEAD_SHA agent=${AGENT:-human} overrides=${OVERRIDES:-none}"

      - name: Lint
        id: lint
        run: |
          set +e
          ARGS=(--base "${{ steps.meta.outputs.base }}" --head "${{ steps.meta.outputs.head }}" --no-stale)
          [ -n "${{ steps.meta.outputs.agent }}" ] && ARGS+=(--agent "${{ steps.meta.outputs.agent }}")
          for o in ${{ steps.meta.outputs.overrides }}; do ARGS+=(--overrides "$o"); done
          [ "${{ github.event_name }}" = "push" ] && ARGS+=(--check-index)
          python3 tools/lint "${ARGS[@]}" | tee lint.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Preconditions
        id: pre
        if: github.event_name == 'pull_request'
        run: |
          set +e
          python3 tools/commit-op --check --base "${{ steps.meta.outputs.base }}" --head "${{ steps.meta.outputs.head }}" --upstream origin/main | tee pre.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report findings on main to the Brain health issue
        if: github.event_name == 'push' && steps.lint.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E '^(error|warn)' lint.txt; echo '```'; } \
            | python3 tools/report-health --repo "${{ github.repository }}" \
                --title "lint on main found problems" --ref "${{ github.sha }}" \
                --agent "${{ steps.meta.outputs.agent }}"

      - name: Fail if the check did not pass
        run: |
          [ "${{ steps.lint.outputs.status }}" = "0" ] || { echo "lint failed"; exit 1; }
          [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.pre.outputs.status }}" = "0" ] || { echo "preconditions failed"; exit 1; }
