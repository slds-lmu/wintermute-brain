name: server-image

on:
  push:
    paths:
      - "server/**"
      - "plugin/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "server/**"
      - "plugin/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest fakeredis ruff
      - run: python -m pytest server/tests
      - run: python -m unittest discover -s tests
      - run: ruff check --select E4,E7,E9,F,I server

  image:
    # Same-repository branches publish immutable test builds on push. Their
    # PR event need not compile the same CUDA backend a second time.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free native-build disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/slds-lmu/wintermute-brain:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/slds-lmu/wintermute-brain:main' || '' }}
          cache-from: type=registry,ref=ghcr.io/slds-lmu/wintermute-brain:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/slds-lmu/wintermute-brain:buildcache,mode=max' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/slds-lmu/wintermute-brain
            org.opencontainers.image.revision=${{ github.sha }}
