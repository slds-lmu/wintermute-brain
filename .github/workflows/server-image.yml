name: server-image

on:
  push:
    paths:
      - "server/**"
      - "plugin/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "server/**"
      - "plugin/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: 'pip install --require-hashes --only-binary=:all: -r server/requirements-dev.lock'
      - run: python -m pytest server/tests
      - run: python -m unittest discover -s tests
      - run: ruff check --select E4,E7,E9,F,I server

  image:
    # Same-repository branches publish immutable test builds on push. Their
    # PR event need not compile the same CUDA backend a second time.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free native-build disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/slds-lmu/wintermute-brain:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/slds-lmu/wintermute-brain:main' || '' }}
          cache-from: type=registry,ref=ghcr.io/slds-lmu/wintermute-brain:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/slds-lmu/wintermute-brain:buildcache,mode=max' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/slds-lmu/wintermute-brain
            org.opencontainers.image.revision=${{ github.sha }}
